name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Volume key support
        run: |
          cat > android/app/src/main/java/com/lightcraft/app/MainActivity.java <<'EOF'
          package com.lightcraft.app;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private volatile boolean camOn = false;
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getBridge().getWebView().addJavascriptInterface(new Object() {
                @JavascriptInterface public void cam(boolean on) { camOn = on; }
                @JavascriptInterface public String save(String b64, String name, String mime) {
                  try {
                    byte[] data = android.util.Base64.decode(b64, android.util.Base64.DEFAULT);
                    android.content.ContentValues v = new android.content.ContentValues();
                    v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, name);
                    v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, mime);
                    if (android.os.Build.VERSION.SDK_INT >= 29) {
                      v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/LightCraft");
                      v.put(android.provider.MediaStore.Images.Media.IS_PENDING, 1);
                    }
                    android.content.ContentResolver r = getContentResolver();
                    android.net.Uri u = r.insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                    java.io.OutputStream o = r.openOutputStream(u);
                    o.write(data);
                    o.close();
                    if (android.os.Build.VERSION.SDK_INT >= 29) {
                      v.clear();
                      v.put(android.provider.MediaStore.Images.Media.IS_PENDING, 0);
                      r.update(u, v, null, null);
                    }
                    return "ok";
                  } catch (Exception e) {
                    return "err: " + e.getMessage();
                  }
                }
              }, "LCNative");
            }
            @Override
            public boolean dispatchKeyEvent(KeyEvent e) {
              int k = e.getKeyCode();
              if (camOn && (k == KeyEvent.KEYCODE_VOLUME_UP || k == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                if (e.getAction() == KeyEvent.ACTION_DOWN) {
                  final String js = "window.lcVol&&window.lcVol('" + (k == KeyEvent.KEYCODE_VOLUME_UP ? "up" : "down") + "'," + e.getRepeatCount() + ")";
                  runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(js, null));
                }
                return true;
              }
              return super.dispatchKeyEvent(e);
            }
          }
          EOF
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: LightCraft-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
