<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LightCraft</title>
<style>
:root{--bg:#0e0e10;--s:#17171a;--s2:#222226;--line:#2c2c31;--txt:#ececee;--dim:#85858c;--ac:#d9a441}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0)}
header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--bg)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
button{font:inherit;color:var(--txt);background:var(--s2);border:0;border-radius:18px;padding:8px 15px;font-size:14px}
button.main{background:var(--ac);color:#1a1405;font-weight:700}
button.on{background:#fff;color:#111}
header div{display:flex;gap:8px}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;background:#08080a}
canvas{max-width:100%;max-height:100%;object-fit:contain}
#home{text-align:center;padding:20px}
#home h2{font-size:26px;margin:0 0 6px}#home p{color:var(--dim);margin:0 0 26px}
#home button{display:block;width:230px;margin:10px auto;padding:15px;font-size:16px}
#cmp{position:absolute;right:12px;bottom:12px;background:rgba(30,30,34,.9);border:1px solid var(--line)}
#sheet{background:var(--s);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#sbox{padding:6px 18px 0}
#srow{display:flex;justify-content:space-between;align-items:center;font-size:14px}
#srow button{background:none;padding:4px 0;min-width:44px;text-align:right;color:var(--ac);font-weight:600}
#trk{position:relative;height:42px;touch-action:none}
#rail{position:absolute;left:0;right:0;top:19px;height:4px;border-radius:2px;background:#3a3a3f}
#fill{position:absolute;top:0;height:100%;background:var(--ac);border-radius:2px}
#thumb{position:absolute;top:11px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #000a}
.strip{display:flex;overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
#chips,#mix{gap:6px;padding:6px 12px}
#chips button{flex:none;padding:7px 13px;font-size:13px;color:var(--dim)}
#chips button.on{color:#111}
#chips button.mod::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin-left:6px;vertical-align:middle}
#mix button{flex:none;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
#mix button.on{border-color:#fff}
#tools{border-top:1px solid var(--line)}
#tools button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border-radius:0;color:var(--dim);font-size:11px;padding:9px 4px 7px}
#tools button.on{color:var(--ac)}#tools svg{width:22px;height:22px}
.hide{display:none!important}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#camtop{display:flex;justify-content:space-between;padding:10px 12px;gap:6px}
#camtop button{background:#26262a;padding:8px 12px;font-size:13px}
#vid{flex:1;min-height:0;width:100%;object-fit:contain}
#camctl{max-height:32%;overflow-y:auto;padding:6px 16px;background:var(--s)}
.crow{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.crow input{width:100%;accent-color:var(--ac)}
.camrow{display:flex;justify-content:space-around;align-items:center;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0))}
#shot{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #777;padding:0}
</style></head><body>
<div id="app">
<header><h1>LightCraft</h1><div><button id="open">Open</button><button id="save" class="main hide">Export</button></div></header>
<div id="stage"><div id="home"><h2>LightCraft</h2><p>Edit like a pro, right on your phone</p><button id="open2" class="main">Open photo</button><button id="cam2">Camera</button></div><canvas id="cv" hidden></canvas><button id="cmp" class="hide">Compare</button></div>
<div id="sheet" class="hide"><div id="sbox"><div id="srow"><span id="sn"></span><button id="sv">0</button></div><div id="trk"><div id="rail"><div id="fill"></div></div><div id="thumb"></div></div></div>
<div id="mix" class="strip hide"></div><div id="chips" class="strip"></div><nav id="tools" class="strip"></nav></div>
</div>
<div id="cam" class="hide"><div id="camtop"><button id="cx">Close</button><button id="fl">Flash off</button><button id="aitog" class="on">AI</button><button id="cf">Flip</button></div>
<video id="vid" playsinline autoplay muted></video><div id="camctl" class="hide"></div>
<div class="camrow"><button id="pro">Pro</button><button id="shot"></button><span style="width:60px"></span></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>

const $=id=>document.getElementById(id);
const S=[
["exposure","Exposure",-2,2,0,"light"],["brightness","Brightness",-1,1,0,"light"],["contrast","Contrast",-1,1,0,"light"],["highlights","Highlights",-1,1,0,"light"],["shadows","Shadows",-1,1,0,"light"],["whites","Whites",-1,1,0,"light"],["blacks","Blacks",-1,1,0,"light"],["vignette","Vignette",0,1,0,"light"],["grain","Grain",0,1,0,"light"],
["temp","Temperature",-1,1,0,"color"],["tint","Tint",-1,1,0,"color"],["vibrance","Vibrance",-1,1,0,"color"],["saturation","Saturation",-1,1,0,"color"],
["gsH","Hue",0,1,0,"color"],["gsS","Strength",0,1,0,"color"],["gmH","Hue",0,1,0,"color"],["gmS","Strength",0,1,0,"color"],["ghH","Hue",0,1,0,"color"],["ghS","Strength",0,1,0,"color"],
["texAmt","Texture",-1,1,0,"detail"],["clarity","Clarity",-1,1,0,"detail"],["dehaze","Dehaze",-1,1,0,"detail"],
["sharpen","Amount",0,1,0,"sharpen"],["sradius","Radius",.5,3,1,"sharpen"],["smask","Masking",0,1,0,"sharpen"],["nrl","Luminance",0,1,0,"sharpen"],["nrc","Color",0,1,0,"sharpen"],
["bamt","Strength",0,1,.5,"blur"],["bfocus","Focus size",.1,1,.35,"blur"],["bfeather","Feather",0,1,.3,"blur"]];
const HD={temp:"White balance",gsH:"Color grading: shadows",gmH:"Color grading: midtones",ghH:"Color grading: highlights",nrl:"Noise reduction"};
const P={Warm:{temp:.35,vibrance:.2,contrast:.1},Cool:{temp:-.35,tint:.05,contrast:.1},Film:{contrast:.2,blacks:.3,saturation:-.15,grain:.4,vignette:.3,temp:.1},Punch:{contrast:.3,vibrance:.4,saturation:.15,shadows:.2,sharpen:.3},Mono:{saturation:-1,contrast:.25,grain:.2}};
try{Object.assign(P,JSON.parse(localStorage.getItem("lc_presets")||"{}"));}catch(e){}
const V={};S.forEach(s=>V[s[0]]=s[4]);
const HS=Array.from({length:8},()=>[0,0,0]);
const NEWCROP=()=>({r:0,flip:false,ang:0,cl:0,cr:0,ct:0,cb:0,land:true});
let crop=NEWCROP(),bmode=0,bc=[.5,.5],selC=0;
const COL=[["Red","#e5484d"],["Orange","#f08c3a"],["Yellow","#e8d44d"],["Green","#4caf50"],["Aqua","#3fc1c9"],["Blue","#3d7be0"],["Purple","#8e5ad7"],["Magenta","#d44c9c"]];
const cv=$("cv"),gl=cv.getContext("webgl",{preserveDrawingBuffer:true,antialias:false});
const vs="attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}";
const fs=`precision highp float;varying vec2 uv;uniform sampler2D t,mk;uniform float bypass,bmode;
uniform mat2 M;uniform vec2 cs,ss,tx,bc,qo;uniform vec3 hsl[8];
uniform float exposure,brightness,contrast,highlights,shadows,whites,blacks,temp,tint,vibrance,saturation,gsH,gsS,gmH,gmS,ghH,ghS,texAmt,clarity,dehaze,sharpen,sradius,smask,nrl,nrc,bamt,bfocus,bfeather,vignette,grain;
float h(vec2 s){return fract(sin(dot(s,vec2(12.9898,78.233)))*43758.5453);}
vec3 smp(vec2 q){return texture2D(t,q).rgb;}
vec3 bl(vec2 q,float r){return(smp(q+vec2(tx.x,0.)*r)+smp(q-vec2(tx.x,0.)*r)+smp(q+vec2(0.,tx.y)*r)+smp(q-vec2(0.,tx.y)*r))*.25;}
float lu(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1e-10;return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}
vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
float cn(int i){if(i==0)return 0.;if(i==1)return .0833;if(i==2)return .1667;if(i==3)return .3333;if(i==4)return .5;if(i==5)return .625;if(i==6)return .75;return .875;}
void main(){
 vec2 ou=vec2(uv.x,1.-uv.y);vec2 q=(M*((ou-.5)*cs)+qo)/ss+.5;
 vec3 o=smp(q);
 if(bypass>.5){gl_FragColor=vec4(o,1.);return;}
 if(bamt>0.&&bmode>.5){float m;
  if(bmode<1.5){m=smoothstep(bfocus,bfocus+.01+bfeather,length((ou-bc)*cs/min(cs.x,cs.y)));}
  else m=1.-texture2D(mk,q).r;
  if(m>.01){vec3 a=o;float R=bamt*.02*max(ss.x,ss.y)*m;
   for(int i=0;i<16;i++){float fi=float(i)+1.;a+=smp(q+vec2(cos(fi*2.39996),sin(fi*2.39996))*sqrt(fi/16.)*R*tx);}
   o=mix(o,a/17.,clamp(m*1.5,0.,1.));}}
 if(nrl+nrc>0.){vec3 a=o,ch=o,o0=o;float ws=1.;
  for(int i=0;i<8;i++){float an=float(i)*.7854;vec3 s=smp(q+vec2(cos(an),sin(an))*tx*2.);float d=length(s-o0);float w=exp(-d*d/(.0005+.03*nrl));a+=s*w;ws+=w;ch+=s;}
  vec3 cb=ch/9.;vec3 dn=mix(o0,a/ws,nrl);float L=lu(dn);o=vec3(L)+mix(dn-L,cb-lu(cb),nrc);}
 vec3 c=o*pow(2.,exposure)+brightness*.25;
 float l=lu(c);
 c+=shadows*.4*(1.-smoothstep(0.,.5,l))+highlights*.4*smoothstep(.5,1.,l);
 c+=blacks*.1;c*=1.+whites*.2;
 c.r+=temp*.1;c.b-=temp*.1;c.g-=tint*.08;
 c=(c-.5)*(1.+contrast)+.5;
 float g=lu(c);float sat=max(max(c.r,c.g),c.b)-min(min(c.r,c.g),c.b);
 c=mix(vec3(g),c,max(0.,1.+saturation+vibrance*(1.-sat)));
 vec3 hv=rgb2hsv(clamp(c,0.,1.));float dh=0.,ds=0.,dl=0.;
 for(int i=0;i<8;i++){float d=abs(hv.x-cn(i));d=min(d,1.-d);float w=(1.-smoothstep(0.,.11,d))*smoothstep(0.,.15,hv.y);dh+=w*hsl[i].x;ds+=w*hsl[i].y;dl+=w*hsl[i].z;}
 hv.x=fract(hv.x+dh*.08);hv.y=clamp(hv.y*(1.+ds),0.,1.);hv.z*=1.+dl*.5;c=hsv2rgb(hv);
 float lg=lu(c);
 c+=(hsv2rgb(vec3(gsH,1.,1.))-.5)*gsS*.35*(1.-smoothstep(0.,.5,lg));
 c+=(hsv2rgb(vec3(gmH,1.,1.))-.5)*gmS*.3*(1.-abs(2.*lg-1.));
 c+=(hsv2rgb(vec3(ghH,1.,1.))-.5)*ghS*.35*smoothstep(.5,1.,lg);
 if(dehaze>0.){c=(c-dehaze*.2)/(1.-dehaze*.2);c=mix(vec3(lu(c)),c,1.+dehaze*.3);}else if(dehaze<0.){c=mix(c,vec3(.75),-dehaze*.25);}
 float mid=1.-abs(2.*lu(o)-1.);
 if(texAmt!=0.)c+=(o-bl(q,2.))*texAmt*1.5;
 if(clarity!=0.)c+=(o-bl(q,10.))*clarity*1.5*mid;
 if(sharpen>0.){vec3 d=o-bl(q,sradius*1.5);float e=abs(lu(d));float mm=smask>0.?smoothstep(smask*.04,smask*.04+.03,e):1.;c+=d*sharpen*2.5*mm;}
 c*=1.-vignette*smoothstep(.3,.95,distance(ou,vec2(.5)));
 c+=(h(ou*cs*.37)-.5)*grain*.25;
 gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))alert("Shader error: "+gl.getShaderInfoLog(gl.getAttachedShaders(pr)[1]));
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
function mkTex(unit){gl.activeTexture(gl.TEXTURE0+unit);const x=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,x);
 [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));return x;}
const tex=mkTex(0),mtex=mkTex(1);
gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,1,1,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,new Uint8Array([255]));
gl.activeTexture(gl.TEXTURE0);
const U={};const u=n=>U[n]||(U[n]=gl.getUniformLocation(pr,n));
gl.uniform1i(u("t"),0);gl.uniform1i(u("mk"),1);
let bypass=0,raf=0,loaded=false,W=1,H=1,M=[1,0,0,1],CW=1,CH=1,srcCv=null,OF=[0,0],BW=1,BH=1;
const mul=(a,b)=>[a[0]*b[0]+a[1]*b[2],a[0]*b[1]+a[1]*b[3],a[2]*b[0]+a[3]*b[2],a[2]*b[1]+a[3]*b[3]];
const rot=d=>{const r=d*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return[c,-s,s,c];};
function layout(){if(!loaded)return;
 const odd=crop.r%2,Wr=odd?H:W,Hr=odd?W:H,a0=Wr/Hr;
 const th=Math.abs(crop.ang)*Math.PI/180,c=Math.cos(th),s=Math.sin(th);
 const h0=Math.min(Wr/(a0*c+s),Hr/(a0*s+c)),w0=a0*h0;BW=w0;BH=h0;
 CW=Math.max(w0*(1-crop.cl-crop.cr),8);CH=Math.max(h0*(1-crop.ct-crop.cb),8);cv.width=Math.round(CW);cv.height=Math.round(CH);
 const of=[(crop.cl-crop.cr)/2*w0,(crop.ct-crop.cb)/2*h0],T=mul(rot(-crop.r*90),[crop.flip?-1:1,0,0,1]);
 M=mul(T,rot(crop.ang));OF=[T[0]*of[0]+T[1]*of[1],T[2]*of[0]+T[3]*of[1]];queue();}
function draw(){raf=0;if(!loaded)return;
 gl.viewport(0,0,cv.width,cv.height);
 S.forEach(s=>gl.uniform1f(u(s[0]),V[s[0]]));
 gl.uniform1f(u("bypass"),bypass);gl.uniform1f(u("bmode"),bmode);gl.uniform2f(u("bc"),bc[0],bc[1]);
 gl.uniform3fv(u("hsl[0]"),new Float32Array(HS.flat()));
 gl.uniformMatrix2fv(u("M"),false,new Float32Array([M[0],M[2],M[1],M[3]]));
 gl.uniform2f(u("cs"),CW,CH);gl.uniform2f(u("ss"),W,H);gl.uniform2f(u("tx"),1/W,1/H);gl.uniform2f(u("qo"),OF[0],OF[1]);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function queue(){if(!raf)raf=requestAnimationFrame(draw);}
/* ===== Lightroom-style UI ===== */
const RB="linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)";
const LBL={temp:"Temperature",gsH:"Shadow hue",gsS:"Shadow amount",gmH:"Mid hue",gmS:"Mid amount",ghH:"Highlight hue",ghS:"Highlight amount",texAmt:"Texture",sharpen:"Sharpening",sradius:"Radius",smask:"Masking",nrl:"Noise reduction",nrc:"Color noise",bamt:"Blur strength",bfocus:"Focus size",bfeather:"Feather"};
const BG={temp:"linear-gradient(90deg,#3d7be0,#ddd,#f0b429)",tint:"linear-gradient(90deg,#4caf50,#ddd,#d44c9c)",gsH:RB,gmH:RB,ghH:RB};
const PR={};let aiS=1,aiTarget={},ratioSel="",ratioAB=[0,1];
S.forEach(s=>PR[s[0]]={label:LBL[s[0]]||s[1],min:s[2],max:s[3],def:s[4],bg:BG[s[0]],get:()=>V[s[0]],set:v=>{V[s[0]]=v;queue();}});
["bamt","bfocus","bfeather"].forEach(k=>PR[k].uni=true);
PR.ai={label:"AI strength",min:0,max:1,def:1,get:()=>aiS,set:v=>{aiS=v;applyAI();}};
["Hue","Saturation","Luminance"].forEach((n,k)=>PR["hsl"+k]={label:n,min:-1,max:1,def:0,bg:k?null:RB,get:()=>HS[selC][k],set:v=>{HS[selC][k]=v;queue();}});
PR.ang={label:"Straighten",min:-30,max:30,def:0,get:()=>crop.ang,set:v=>{crop.ang=v;layout();}};
const OPP={cl:"cr",cr:"cl",ct:"cb",cb:"ct"};
[["cl","Crop left"],["cr","Crop right"],["ct","Crop top"],["cb","Crop bottom"]].forEach(([k,n])=>PR[k]={label:n,min:0,max:.5,def:0,get:()=>crop[k],set:v=>{crop[k]=Math.min(v,.9-crop[OPP[k]]);layout();}});
const isUni=p=>p.uni||p.def==p.min||p.def==p.max;
const toD=(p,v)=>isUni(p)?(v-p.min)/(p.max-p.min)*100:(v>=p.def?(v-p.def)/(p.max-p.def):(v-p.def)/(p.def-p.min))*100;
const fromD=(p,d)=>isUni(p)?p.min+d/100*(p.max-p.min):(d>=0?p.def+d/100*(p.max-p.def):p.def+d/100*(p.def-p.min));
const isMod=id=>{const p=PR[id];return Math.abs(toD(p,p.get())-toD(p,p.def))>.5;};
let cur=null,tool="light",items=[];
const trk=$("trk"),fill=$("fill"),thumb=$("thumb");
function showSlider(){const sb=$("sbox");if(!cur){sb.classList.add("hide");return;}sb.classList.remove("hide");
 const p=PR[cur],d=toD(p,p.get()),uni=isUni(p),f=uni?d/100:(d+100)/200;
 $("sn").textContent=p.label;$("sv").textContent=Math.round(d);thumb.style.left=f*100+"%";
 $("rail").style.background=p.bg||"#3a3a3f";fill.style.display=p.bg?"none":"";
 fill.style.left=(uni?0:Math.min(50,f*100))+"%";fill.style.width=(uni?f*100:Math.abs(f*100-50))+"%";}
function setD(d){const p=PR[cur],uni=isUni(p);d=Math.max(uni?0:-100,Math.min(100,d));if(!uni&&Math.abs(d)<2)d=0;p.set(fromD(p,d));refresh();}
let drag=null;
trk.addEventListener("pointerdown",e=>{if(!cur)return;trk.setPointerCapture(e.pointerId);drag={x:e.clientX,m:false};});
trk.addEventListener("pointermove",e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>8)drag.m=true;
 if(drag.m){const r=trk.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));setD(isUni(PR[cur])?f*100:f*200-100);}});
trk.addEventListener("pointerup",e=>{if(!drag)return;if(!drag.m){const r=thumb.getBoundingClientRect();setD(toD(PR[cur],PR[cur].get())+(e.clientX>r.left+r.width/2?2:-2));}drag=null;});
trk.addEventListener("pointercancel",()=>drag=null);
$("sv").onclick=()=>{if(!cur)return;PR[cur].set(PR[cur].def);refresh();};
function refresh(){[...$("chips").children].forEach((b,i)=>{const it=items[i];if(!it)return;b.classList.toggle("on",it.p?it.p==cur:!!(it.on&&it.on()));b.classList.toggle("mod",!!it.p&&isMod(it.p));});showSlider();}
const L7=["exposure","brightness","contrast","highlights","shadows","whites","blacks"],pp=a=>a.map(p=>({p}));
const RT=[["Original",0,0],["1:1",1,1],["5:4",5,4],["4:3",4,3],["3:2",3,2],["16:9",16,9],["2:1",2,1],["21:9",21,9],["7:5",7,5]];

const TOOLS=[

["blur","Blur",()=>[{l:"Off",a:()=>setMode(0),on:()=>bmode==0},{l:"Portrait",a:()=>setMode(1),on:()=>bmode==1},{l:"Auto",a:()=>setMode(2),on:()=>bmode==2},{p:"bamt"},{p:"bfocus"},{p:"bfeather"}]],
["crop","Crop",()=>[...pp(["ang","cl","cr","ct","cb"]),{l:"Auto level",a:autoLevel},{l:"Rotate",a:()=>{crop.r=(crop.r+1)%4;layout();}},{l:"Flip",a:()=>{crop.flip=!crop.flip;layout();},on:()=>crop.flip},
 {l:crop.land?"Landscape":"Portrait",a:()=>{crop.land=!crop.land;ratioAB[0]?setRatio(...ratioAB):layout();}},
 ...RT.map(([n,a,b])=>({l:!a?n:(crop.land||a==b?a+":"+b:b+":"+a),a:()=>{ratioSel=n;ratioAB=[a,b];setRatio(a,b);},on:()=>ratioSel==n})),{l:"Reset crop",a:resetCrop}]],
["presets","Presets",()=>[...Object.keys(P).map(k=>({l:k,a:()=>apply(P[k])})),{l:"Save current",a:savePreset},{l:"Reset all",a:()=>{apply();setMode(0);}}]],

function renderChips(){const box=$("chips");box.innerHTML="";items=TOOLS.find(t=>t[0]==tool)[2]();
 items.forEach(it=>{const b=document.createElement("button");b.textContent=it.l||PR[it.p].label;
  b.onclick=()=>{if(it.p)cur=it.p;else{it.a();renderChips();}refresh();};box.appendChild(b);});}
function setTool(id){tool=id;renderChips();const f=items.find(i=>i.p);cur=f?f.p:null;
 $("mix").classList.toggle("hide",id!="mixer");[...$("tools").children].forEach(b=>b.classList.toggle("on",b.dataset.t==id));refresh();}
TOOLS.forEach(t=>{const b=document.createElement("button");b.dataset.t=t[0];b.innerHTML=svg(IC[t[0]])+t[1];b.onclick=()=>t[2]?setTool(t[0]):startCam();$("tools").appendChild(b);});
COL.forEach((c,i)=>{const b=document.createElement("button");b.style.background=c[1];b.onclick=()=>{selC=i;[...$("mix").children].forEach((x,k)=>x.classList.toggle("on",k==i));refresh();};$("mix").appendChild(b);});

function setMode(i){bmode=i;queue();}
cv.onclick=e=>{if(bmode!=1)return;const r=cv.getBoundingClientRect();bc=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];queue();};
function setRatio(a,b){crop.cl=crop.cr=crop.ct=crop.cb=0;layout();
 if(a){const ar=crop.land?a/b:b/a,fa=BW/BH;if(ar>fa){crop.ct=crop.cb=(1-(BW/ar)/BH)/2;}else{crop.cl=crop.cr=(1-(BH*ar)/BW)/2;}layout();}}
function resetCrop(){crop=NEWCROP();ratioSel="";ratioAB=[0,0];layout();}
function autoLevel(){if(!loaded)return;const n=256,k=Math.min(1,n/Math.max(W,H)),w=Math.round(W*k),h=Math.round(H*k);
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(srcCv,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
 const g=(i,j)=>{const p=(j*w+i)*4;return d[p]*.3+d[p+1]*.59+d[p+2]*.11;};const bins=new Float32Array(61);
 for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const gx=g(i+1,j)-g(i-1,j),gy=g(i,j+1)-g(i,j-1),m=Math.hypot(gx,gy);if(m<40)continue;
  let a=Math.atan2(gy,gx)*180/Math.PI;a=(((a+45)%90)+90)%90-45;if(Math.abs(a)<=15)bins[Math.round((a+15)*2)]+=m;}
 let best=30,bv=-1;for(let i=1;i<60;i++){const v=bins[i-1]+bins[i]*2+bins[i+1];if(v>bv){bv=v;best=i;}}
 const dl=best/2-15;crop.ang=Math.round((crop.flip?-dl:dl)*10)/10;layout();}
/* ---- AI enhance ---- */
function analyze(){const n=96,c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");x.drawImage(srcCv,0,0,n,n);const d=x.getImageData(0,0,n,n).data;
 let r=0,g=0,b=0,ss=0;const hist=new Float32Array(256),N=n*n;
 for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];ss+=Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]);hist[Math.round(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)]++;}
 r/=N*255;g/=N*255;b/=N*255;ss/=N*255;const m=.2126*r+.7152*g+.0722*b;
 const pc=p=>{let a=0;for(let i=0;i<256;i++){a+=hist[i];if(a>=N*p)return i/255;}return 1;};
 const p1=pc(.01),p5=pc(.05),p95=pc(.95),p99=pc(.99),cl=(v,a,e)=>Math.max(a,Math.min(e,v));
 return{exposure:cl(Math.log2(.45/Math.max(m,.03)),-1.3,1.3)*.8,shadows:cl((.12-p5)*4,0,.7),highlights:-cl((p95-.9)*8,0,.6),blacks:cl(-(p1-.02)*4,-.6,0),whites:cl((.96-p99)*3,0,.6),contrast:p95-p5<.6?.15:.05,
  temp:cl((b-r)/.2,-1,1)*.6,tint:cl((g-(r+b)/2)/.08,-1,1)*.4,vibrance:ss<.25?.3:.15,texAmt:.15,clarity:.15,dehaze:p95-p5<.5?.2:.05,sharpen:.3,smask:.3,nrl:m<.25?.3:.1,nrc:m<.25?.3:.15,gsH:.52,gsS:.15,ghH:.09,ghS:.12};}
function applyAI(){for(const k in aiTarget){const d=PR[k].def;V[k]=d+(aiTarget[k]-d)*aiS;}queue();refresh();}
function aiRun(keys){if(!loaded)return;const o=analyze();aiTarget={};(keys||Object.keys(o)).forEach(k=>aiTarget[k]=o[k]);aiS=1;applyAI();}
/* ---- presets ---- */
function apply(o){S.forEach(s=>{V[s[0]]=o&&o[s[0]]!==undefined?o[s[0]]:s[4];});HS.forEach(a=>a.fill(0));queue();refresh();}
function savePreset(){const n=prompt("Preset name");if(!n)return;P[n]={...V};
 try{const a=JSON.parse(localStorage.getItem("lc_presets")||"{}");a[n]=P[n];localStorage.setItem("lc_presets",JSON.stringify(a));}catch(e){}renderChips();refresh();}
const cmp=$("cmp");
["touchstart","mousedown"].forEach(e=>cmp.addEventListener(e,ev=>{ev.preventDefault();bypass=1;queue();}));
["touchend","mouseup","mouseleave","touchcancel"].forEach(e=>cmp.addEventListener(e,()=>{bypass=0;queue();}));
/* ---- camera ---- */
let stream,track,face="environment",flash=0,aiCap=true;
const torch=on=>{if(track)track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});};
async function startCam(){stopCam();
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:4096},height:{ideal:3072}},audio:false});}
 catch(e){alert("Camera not available: "+e.message);return;}
 flash=0;$("fl").textContent="Flash off";$("cam").classList.remove("hide");$("vid").srcObject=stream;track=stream.getVideoTracks()[0];camCtl();}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
function camCtl(){const host=$("camctl");host.innerHTML="";const caps=track.getCapabilities?track.getCapabilities():{},st=track.getSettings?track.getSettings():{};let any=false;
 [["iso","ISO"],["exposureTime","Shutter"],["exposureCompensation","Exposure"],["colorTemperature","White bal."],["focusDistance","Focus"],["zoom","Zoom"]].forEach(([k,l])=>{
  const c=caps[k];if(!c||c.min===undefined)return;any=true;const v0=st[k]!==undefined?st[k]:c.min;
  const r=document.createElement("div");r.className="crow";
  r.innerHTML=`<span>${l}</span><input type="range" min="${c.min}" max="${c.max}" step="${c.step||(c.max-c.min)/100}" value="${v0}"><span>${(+v0).toFixed(1)}</span>`;
  const i=r.children[1],n=r.children[2];
  i.oninput=async()=>{n.textContent=(+i.value).toFixed(1);const a={[k]:+i.value};
   if(k=="iso"||k=="exposureTime")a.exposureMode="manual";if(k=="colorTemperature")a.whiteBalanceMode="manual";if(k=="focusDistance")a.focusMode="manual";
   try{await track.applyConstraints({advanced:[a]});}catch(e){}};host.appendChild(r);});
 if(!any)host.innerHTML="<div style='color:var(--dim);font-size:13px;padding:6px 0'>This phone does not share manual ISO/shutter controls with apps.</div>";
 const b=document.createElement("button");b.textContent="Back to auto";b.onclick=()=>{track.applyConstraints({advanced:[{exposureMode:"continuous",whiteBalanceMode:"continuous",focusMode:"continuous"}]}).catch(()=>{});camCtl();};host.appendChild(b);}
$("fl").onclick=()=>{const caps=track&&track.getCapabilities?track.getCapabilities():{};if(!caps.torch){alert("Flash is not available on this camera (front camera or unsupported phone).");return;}
 flash=(flash+1)%3;$("fl").textContent=["Flash off","Flash on","Flash auto"][flash];torch(flash==1);};
$("aitog").onclick=()=>{aiCap=!aiCap;$("aitog").classList.toggle("on",aiCap);};
$("pro").onclick=()=>$("camctl").classList.toggle("hide");
$("cf").onclick=()=>{face=face=="environment"?"user":"environment";startCam();};
$("cx").onclick=()=>{stopCam();$("cam").classList.add("hide");};
$("shot").onclick=async()=>{const v=$("vid");if(!v.videoWidth)return;let lit=false;
 if(flash==2){const t=document.createElement("canvas");t.width=t.height=16;const x=t.getContext("2d");x.drawImage(v,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  if(s/256<70){lit=true;torch(true);await new Promise(r=>setTimeout(r,450));}}
 const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 if(lit)torch(false);stopCam();$("cam").classList.add("hide");loadSource(c,c.width,c.height);if(aiCap)aiRun();};

function autoMask(){const n=96,c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");x.drawImage(srcCv,0,0,n,n);const d=x.getImageData(0,0,n,n).data;
 let r=0,g=0,b=0,k=0;for(let i=0;i<n;i++)for(const j of[0,1,n-2,n-1])for(const[a,e]of[[i,j],[j,i]]){const p=(e*n+a)*4;r+=d[p];g+=d[p+1];b+=d[p+2];k++;}
 r/=k;g/=k;b/=k;let m=new Float32Array(n*n),mx=1e-6;
 for(let y=0;y<n;y++)for(let i=0;i<n;i++){const p=(y*n+i)*4,cx=i/n-.5,cy=y/n-.5,v=Math.hypot(d[p]-r,d[p+1]-g,d[p+2]-b)*Math.exp(-(cx*cx+cy*cy)/.18);m[y*n+i]=v;mx=Math.max(mx,v);}
 for(let pass=0;pass<4;pass++){const o=new Float32Array(n*n);for(let y=0;y<n;y++)for(let i=0;i<n;i++){let s=0,q=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=i+dx;if(yy<0||xx<0||yy>=n||xx>=n)continue;s+=m[yy*n+xx];q++;}o[y*n+i]=s/q;}m=o;}
 const out=new Uint8Array(n*n);for(let i=0;i<n*n;i++){const t=Math.max(0,Math.min(1,(m[i]/mx-.2)/.35));out[i]=Math.round(t*t*(3-2*t)*255);}
 gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,n,n,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,out);gl.activeTexture(gl.TEXTURE0);}
function loadSource(src,w0,h0){const k=Math.min(1,3000/Math.max(w0,h0));W=Math.round(w0*k);H=Math.round(h0*k);
 srcCv=document.createElement("canvas");srcCv.width=W;srcCv.height=H;srcCv.getContext("2d").drawImage(src,0,0,W,H);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCv);
 autoMask();loaded=true;$("home").classList.add("hide");cv.hidden=false;["sheet","save","cmp"].forEach(i=>$(i).classList.remove("hide"));
 resetCrop();bmode=0;apply();setTool("light");}
const file=$("file");$("open").onclick=$("open2").onclick=()=>file.click();$("cam2").onclick=startCam;
file.onchange=()=>{const f=file.files[0];if(!f)return;const img=new Image();img.onload=()=>{loadSource(img,img.width,img.height);URL.revokeObjectURL(img.src);};img.src=URL.createObjectURL(f);file.value="";};
