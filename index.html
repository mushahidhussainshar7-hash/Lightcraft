<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LightCraft</title>
<style>
:root{--bg:#111;--s:#1b1b1d;--s2:#2e2e2e;--panel:#222224;--line:#3a3a3a;--txt:#eee;--dim:#9a9a9a;--ac:#64a9ff;--blue:#2f80ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:Roboto,"Segoe UI",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.main{background:var(--blue);color:#fff;font-weight:600;border-radius:10px;padding:11px 14px}
#lib{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0);background:#151515;position:relative}
#ltop{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--s)}#ltop b{font-size:14px;letter-spacing:2px}
#ltop div{display:flex;gap:6px}#ltop button{padding:8px 13px;font-size:13px;color:#ddd;background:var(--s2);border-radius:16px}
#ltitle{display:flex;align-items:center;justify-content:space-between;padding:18px 17px 6px}#lt{font-size:20px;font-weight:600}#lcount{font-size:13px;color:var(--dim)}
#grid{flex:1;overflow-y:auto;padding:0 3px 96px}
.mh{padding:14px 14px 4px;color:#ddd;font-size:15px;font-weight:600}.dh{font-size:12px;color:var(--dim);margin:6px 14px 4px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.cell{position:relative;aspect-ratio:1;background:#303030;overflow:hidden}.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .bd{position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.cell.sel::after{content:"";position:absolute;inset:0;background:#2684ed66;border:3px solid var(--ac)}
.empty{color:#888;text-align:center;padding:70px 30px;line-height:1.7;font-size:14px}
#fab{position:absolute;right:18px;bottom:82px;background:var(--blue);border-radius:40px;display:flex;overflow:hidden;box-shadow:0 4px 14px #0008;z-index:3;color:#fff}
.fb{display:flex;align-items:center;justify-content:center;padding:14px 18px;color:#fff}
#nav{display:flex;height:62px;flex:none;background:var(--s);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#aaa;font-size:11px}#nav button.on{color:var(--ac)}#nav svg{width:22px;height:22px}
#selbar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));background:var(--s)}#selbar button{flex:1;background:var(--s2);border-radius:10px;padding:12px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0);background:#000;position:relative}
#top{height:46px;flex:none;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.tg{display:flex;align-items:center;gap:2px}.tg button{padding:9px 10px;color:#eee}.tg svg{width:22px;height:22px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;padding:2px;touch-action:none}
canvas{max-width:100%;max-height:100%;object-fit:contain}
#beforeBadge{position:absolute;top:12px;left:12px;background:#0009;padding:5px 8px;font-size:10px;letter-spacing:1px}
#panel{flex:none;background:var(--panel);display:flex;flex-direction:column;height:31vh;animation:pin .16s ease}#panel.full{height:56vh}@keyframes pin{from{opacity:.4}to{opacity:1}}
#ptabs{flex:none;display:flex;gap:6px;padding:8px 16px 2px;overflow-x:auto;scrollbar-width:none}
#ptabs button{flex:none;padding:6px 14px;font-size:12px;color:#aaa;border-radius:14px;background:#2e2e30}#ptabs button.on{background:#fff;color:#111}
#prows{flex:1;min-height:0;overflow-y:auto;padding:0 16px 8px}
#dock{flex:none;background:var(--s);padding-bottom:env(safe-area-inset-bottom,0)}
.tool{position:relative;min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#bdbdbd;font-size:10.5px;white-space:nowrap;border-radius:8px}.tool svg{width:20px;height:20px}
.tool i{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#3a3a3c}.tool i.m{background:#ddd}
#stools{height:58px;display:flex;overflow-x:auto;scrollbar-width:none;padding:4px 4px 0}#stools::-webkit-scrollbar{display:none}#stools .tool{flex:0 0 68px}#stools .tool.sel{background:#3a3a3c;color:#fff}
#ptools{height:52px;display:flex;justify-content:space-around;padding:4px 6px}#ptools .tool.sel{background:var(--blue);color:#fff}
.row{padding:6px 0 0}.rowhead{display:flex;justify-content:space-between;align-items:center;font-size:13px}.rowhead output{color:#ddd;font-size:12.5px;min-width:48px;text-align:right;padding:3px 0;cursor:pointer}
.trk{position:relative;height:32px;touch-action:pan-y}.rail{position:absolute;left:0;right:0;top:15px;height:2px;border-radius:2px;background:#555}.fill{position:absolute;top:0;height:100%;background:#cfcfcf;border-radius:2px}
.th{position:absolute;top:5px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:2px solid #d0d0d0;background:#222224}
.row.act .th{background:#d0d0d0}.row.act .th:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#000}
#app.dragging #top,#app.dragging #dock,#app.dragging #xp{visibility:hidden}
#app.dragging #panel{background:#000}#app.dragging #panel *{visibility:hidden}
#app.dragging #panel .row.act,#app.dragging #panel .row.act .trk,#app.dragging #panel .row.act .trk *{visibility:visible}
.bgrid{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 8px}.b{background:#333;border-radius:6px;padding:9px 13px;font-size:12px;color:#ddd}.b.on{background:#fff;color:#111}
.note{color:#aaa;font-size:13px;line-height:1.6;padding:16px 0}
.selrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px}.selrow select{background:transparent;color:#eee;border:0;padding:6px;font-size:13.5px}
.topbtns{display:flex;gap:8px;padding:8px 0 2px}.tb{flex:1;border:1px solid #555;border-radius:8px;padding:8px 6px;display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;background:#18181a;color:#ddd}.tb.on{background:#fff;color:#111}.tb svg{width:17px;height:17px}
.sh{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px;font-size:16px}.sh button{background:#111;border-radius:6px;padding:8px 18px;font-size:13px;color:#ddd}
.tones{display:flex;justify-content:center;align-items:flex-start;gap:18px;padding:4px 0}.tn{display:flex;flex-direction:column;align-items:center;gap:6px}
.tn .ic{width:26px;height:26px;border-radius:50%;border:3px solid #555;display:block}.tn.on .ic{border-color:#fff}
.ic.gs{background:#000}.ic.gm{background:#666;border-color:#666}.ic.gh{background:#ddd;border-color:#ddd}.ic.gg{background:linear-gradient(90deg,#222 50%,#eee 50%)}
.tn.on .ic.gm,.tn.on .ic.gh{border-color:#fff}.tn i{width:5px;height:5px;border-radius:50%;background:#555}.tn i.m{background:#ddd}.sep{width:1px;height:30px;background:#555;margin-top:2px}
.wheels{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 0}.wheels::-webkit-scrollbar{display:none}
.slide{flex:0 0 84%;scroll-snap-align:center;height:184px;display:flex;align-items:center;justify-content:center}
.wheel{position:relative;width:156px;height:156px;border-radius:50%;touch-action:none;background:conic-gradient(#ff263b,#ffdf00,#20df4a,#00dce8,#245bff,#bd20ff,#ff267b,#ff263b)}
.wheel:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff0 70%)}
.wheel .o{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#333}
.pin{position:absolute;width:24px;height:24px;border:2px solid #777;background:#ffffff40;border-radius:50%;transform:translate(-50%,-50%)}
.rim{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:15px}.trow button{padding:2px 8px;color:#ddd;font-size:14px}
.mixdots{display:flex;justify-content:space-between;gap:6px;padding:8px 2px 4px}.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--sw);display:grid;place-items:center;flex:none;padding:0}.dot.on:after{content:"";width:11px;height:11px;border-radius:50%;background:#fff}
#xp{background:var(--panel);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0))}
#xp h3{margin:0 0 8px;font-size:17px}.xr{display:flex;gap:8px;margin:10px 0;align-items:center}.xr span{font-size:13px;color:var(--dim);width:60px}
.xr button{padding:8px 14px;font-size:13px;color:#ccc;background:#333;border-radius:6px}.xr button.on{background:#fff;color:#111}.xr button.main{background:var(--blue);color:#fff}.xr input{flex:1;accent-color:#ddd}
#menu{position:fixed;z-index:25;background:#2a2a2a;border-radius:10px;box-shadow:0 6px 24px #000c;min-width:190px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;color:#ddd}#menu button.on{color:var(--ac)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:14px;font-size:13px;z-index:30;max-width:90%;text-align:center}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#camtop{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px}#camtop button{padding:10px;color:#fff;position:relative}#camtop div{display:flex;gap:4px}
#cfmt{font-weight:700;font-size:13px;border:2px solid #fff;border-radius:3px;padding:1px 6px!important}
#fl.on{color:#ffd24a}#fl small{position:absolute;right:4px;top:6px;font-size:10px;font-weight:700}
#vw{position:relative;overflow:hidden;background:#111;margin:0 auto;flex:1;min-height:0;width:100%}
#vid{width:100%;height:100%;object-fit:cover;will-change:transform;transform-origin:center}
#cbar2{height:48px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 16px;background:#000}#cbar2 button{padding:8px 10px;color:#ccc;font-size:15px;display:flex;align-items:center;gap:2px}
#procol{flex:none;background:#000;padding:4px 14px 0}#prow{display:flex;justify-content:space-between;align-items:flex-end;height:50px}
#prow button{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#fff;min-width:54px}#prow button b{font-size:17px;font-weight:700;font-style:italic}#prow button.m{color:#ffd24a}#prow button.sel{text-decoration:underline}
#pslide{height:34px;padding:4px 2px}#pslide input{width:100%;accent-color:#ffd24a}
.camrow{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 22px calc(12px + env(safe-area-inset-bottom,0));background:#08090f}
#mode{color:#eee;font-size:17px;display:flex;align-items:center;gap:4px;min-width:96px}
#shot{width:78px;height:78px;border-radius:50%;background:#3a86d4;border:5px solid #fff;padding:0}
.cright{display:flex;gap:14px;min-width:96px;justify-content:flex-end}.cright button{color:#8a8a8a;padding:6px}.cright button.on{color:#fff}
#zpill,#epill{position:absolute;bottom:10px;display:flex;align-items:center;background:#0009;border-radius:16px;font-size:12px;color:#fff}#zpill{right:10px}#epill{left:10px}#zpill button,#epill button{padding:7px 11px}
#lastshot{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:10px;padding:0;background:#26262a center/cover no-repeat;border:2px solid #fff6}
#flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .22s}
#grid3{position:absolute;inset:0;pointer-events:none}#grid3 svg{width:100%;height:100%}
#pbl{position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#subj{position:absolute;border:2px solid #ffd24a;border-radius:10px;pointer-events:none}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#cset{position:absolute;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:8}
#cset .card{width:88%;max-height:82%;overflow-y:auto;background:#4a4a4c;border-radius:6px;padding:18px 20px;box-shadow:0 6px 30px #000a}
#cset h3{text-align:center;margin:0 0 8px;font-size:22px;font-weight:500}
.srow{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:17px;gap:10px}.srow select{background:transparent;color:#ddd;border:0;font-size:15px;max-width:46%}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:20px;border-radius:10px;background:#777;position:relative;flex:none;outline:0;border:0}.sw:before{content:"";position:absolute;left:0;top:-4px;width:28px;height:28px;border-radius:50%;background:#ddd;transition:.15s;box-shadow:0 1px 4px #0006}.sw:checked{background:#4d9a90}.sw:checked:before{left:22px;background:#7fe0cf}
#cropov{position:absolute;overflow:hidden;touch-action:none}
.cfr{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 3000px #000a;background:linear-gradient(90deg,transparent 33.2%,#fff6 33.2%,#fff6 33.6%,transparent 33.6%,transparent 66.4%,#fff6 66.4%,#fff6 66.8%,transparent 66.8%),linear-gradient(0deg,transparent 33.2%,#fff6 33.2%,#fff6 33.6%,transparent 33.6%,transparent 66.4%,#fff6 66.4%,#fff6 66.8%,transparent 66.8%)}
.cfr .cmv{position:absolute;inset:16px}.cfr b{position:absolute;width:40px;height:40px;margin:-20px}.cfr b:after{content:"";position:absolute;background:#fff;border-radius:2px}
.cfr b[data-h=tl]{left:0;top:0}.cfr b[data-h=tr]{left:100%;top:0}.cfr b[data-h=bl]{left:0;top:100%}.cfr b[data-h=br]{left:100%;top:100%}
.cfr b[data-h=t]{left:50%;top:0}.cfr b[data-h=b]{left:50%;top:100%}.cfr b[data-h=l]{left:0;top:50%}.cfr b[data-h=r]{left:100%;top:50%}
.cfr b[data-h=tl]:after,.cfr b[data-h=tr]:after,.cfr b[data-h=bl]:after,.cfr b[data-h=br]:after{width:18px;height:18px;background:none;border:3px solid #fff;border-radius:0;left:11px;top:11px}
.cfr b[data-h=tl]:after{border-right:0;border-bottom:0}.cfr b[data-h=tr]:after{border-left:0;border-bottom:0}.cfr b[data-h=bl]:after{border-right:0;border-top:0}.cfr b[data-h=br]:after{border-left:0;border-top:0}
.cfr b[data-h=t]:after,.cfr b[data-h=b]:after{width:26px;height:4px;left:7px;top:18px}.cfr b[data-h=l]:after,.cfr b[data-h=r]:after{width:4px;height:26px;left:18px;top:7px}
#fring{position:absolute;width:68px;height:68px;margin:-34px;border:2px solid #ffd24a;border-radius:50%;pointer-events:none}#fring.go{animation:fr .5s ease}@keyframes fr{from{transform:scale(1.5);opacity:.2}to{transform:scale(1);opacity:1}}
#fcs{flex:none;display:flex;align-items:center;gap:10px;padding:6px 18px;background:#000;font-size:12px;color:#ccc}#fcs input{flex:1;accent-color:#ffd24a}#fcs button{padding:6px 10px;border:1px solid #666;border-radius:12px;font-size:11px}
.rst{color:#fff;font-size:17px;padding:8px 0;text-align:left}
</style></head><body>
<div id="lib">
 <div id="ltop"><b>LIGHTCRAFT</b><div><button id="selbtn">Select</button><button id="gear">AI setup</button></div></div>
 <div id="ltitle"><button id="lt">Gallery</button><span id="lcount"></span></div>
 <div id="grid"></div>
 <div id="fab"><label class="fb" for="file" aria-label="Import"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></label><button class="fb" id="fabcam" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div>
 <div id="selbar" class="hide"></div><nav id="nav"></nav>
</div>
<div id="app" class="hide">
 <header id="top">
  <div class="tg"><button id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>

 </header>
 <main id="stage"><canvas id="cv" hidden></canvas><div id="beforeBadge" class="hide">BEFORE</div></main>
 <section id="panel" class="hide"><div id="ptabs" class="hide"></div><div id="prows"></div></section>
 <section id="dock" class="hide"><div id="stools" class="hide"></div><div id="ptools"></div></section>
 <div id="xp" class="hide"></div>
</div>
<div id="cam" class="hide">
 <div id="camtop"><button id="cx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button id="cfmt">JPG</button><div><button id="fl" aria-label="Flash"></button><button id="cf" aria-label="Flip camera"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M9 12a3 3 0 0 1 5-2M15 12a3 3 0 0 1-5 2"/></svg></button></div></div>
 <div id="vw"><video id="vid" playsinline autoplay muted></video><div id="grid3" class="hide"></div><div id="pbl" class="hide"></div><div id="subj" class="hide"></div><div id="cd" class="hide"></div><div id="flashfx"></div><div id="fring" class="hide"></div>
  <button id="lastshot" aria-label="Last photo"></button>
  <div id="epill"><button id="evm">-</button><span id="evl">EV 0.0</span><button id="evp">+</button></div>
  <div id="zpill"><button id="zm">-</button><span id="zl">1.0x</span><button id="zp">+</button></div></div>
 <div id="cbar2"><button id="asp">Full</button><button id="tm" aria-label="Timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></svg><span id="tmn">0</span></button><button id="grd" aria-label="Grid"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg></button><button id="fbtn" aria-label="Focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button><button id="cs" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button><button id="cmore" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button></div>
 <div id="procol" class="hide"><div id="prow"></div><div id="pslide"></div></div>
 <div id="fcs" class="hide"><span>Near</span><input type="range" min="0" max="1" step="0.01" value="0.5"><span>Far</span><button id="fauto">AUTO</button></div>
 <div class="camrow"><button id="mode">Auto <svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 9l6 6 6-6"/></svg></button><button id="shot" aria-label="Capture"></button><div class="cright"><button id="aelock" aria-label="Exposure lock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button><button id="cgrade" class="on" aria-label="Auto color grading and white balance"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg></button></div></div>
 <div id="cset" class="hide"></div>
</div>
<input type="file" id="file" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<div id="menu" class="hide"></div><div id="toast" class="hide"></div>
<script>

const $=id=>document.getElementById(id);

function setView(v){view=v;selMode=false;sel.clear();renderLib();}
function renderLib(){const g=$("grid");g.innerHTML="";const gal=view=="gallery";
 $("lt").innerHTML=gal?"Gallery":FOLD.find(f=>f[0]==folder)[1]+" &#9662;";
 [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.s==view));
 const list=gal?LIB.filter(r=>!r.deleted&&r.source=="import"):LIB.filter(r=>inFolder(r,folder));
 $("lcount").textContent=list.length+(list.length==1?" photo":" photos");updSel();$("fab").classList.toggle("hide",selMode);
 if(!list.length){g.innerHTML='<div class="empty">'+(gal?"No imported photos yet.<br>Tap + to import photos from your phone.":"No photos here yet.<br>Import photos or take some with the Camera.")+'</div>';return;}
 let lm="",ld="",cells=null;
 list.forEach(r=>{const d=new Date(r.date),m=d.toLocaleDateString(undefined,{month:"long",year:"numeric"}),dd=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  if(m!=lm){const h=document.createElement("div");h.className="mh";h.textContent=m;g.appendChild(h);lm=m;ld="";}
  if(dd!=ld){const h=document.createElement("div");h.className="dh";h.textContent=dd;g.appendChild(h);cells=document.createElement("div");cells.className="cells";g.appendChild(cells);ld=dd;}
  const c=document.createElement("div");c.className="cell"+(sel.has(r.id)?" sel":"");
  c.innerHTML=(r.thumb?'<img decoding="async" src="'+r.thumb+'">':'<div class="empty" style="padding:30px 0">?</div>')+(r.edited?'<i class="bd"></i>':"");
  let lp=null,fired=false;
  c.onpointerdown=()=>{fired=false;lp=setTimeout(()=>{fired=true;selMode=true;toggleSel(r.id,c);},450);};
  c.onpointerup=c.onpointerleave=c.onpointercancel=()=>clearTimeout(lp);
  c.onclick=()=>{if(fired)return;if(selMode)toggleSel(r.id,c);else openItem(r.id);};
  cells.appendChild(c);});}
$("lt").onclick=()=>{if(view=="lc")showMenu(FOLD.map(([k,l])=>[l+"  ("+LIB.filter(r=>inFolder(r,k)).length+")",()=>{folder=k;sel.clear();renderLib();},k==folder]),{top:110,left:14});};
$("fabcam").onclick=startCam;
IC.gallery='<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-8 8"/>';IC.lc='<path d="M3 4h7v7H3zM14 4h7v7h-7zM3 15h7v5H3zM14 15h7v5h-7z"/>';
[["gallery","Gallery",IC.gallery],["lc","LightCraft",IC.lc],["cam","Camera",IC.camera]].forEach(([s,l,ic])=>{const b=document.createElement("button");b.dataset.s=s;b.innerHTML=svg(ic)+l;b.onclick=()=>s=="cam"?startCam():setView(s);$("nav").appendChild(b);});
/* ---- editor open / save ---- */
const defV=()=>{const o={};S.forEach(s=>o[s[0]]=s[4]);return o;};
const params=()=>({V:{...V},HS:HS.map(a=>[...a]),crop:{...crop},bmode,bc:[...bc]});
const defParams=()=>({V:defV(),HS:Array.from({length:8},()=>[0,0,0]),crop:NEWCROP(),bmode:0,bc:[.5,.5]});
function afterOpen(r){if(r.params){const p=r.params;Object.assign(V,p.V);p.HS.forEach((a,i)=>HS[i]=a);crop=Object.assign(NEWCROP(),p.crop);bmode=p.bmode||0;bc=p.bc||[.5,.5];layout();renderChips();refresh();queue();return;}
 if(r.autoAI)camAuto();else if(r.evSoft){V.exposure=r.evSoft;queue();refresh();}
 if(r.portrait){V.bamt=.7;if(r.pc){bc=[...r.pc];V.bfocus=.3;setMode(1);}else if(KEY())aiSubject();else{autoMask();setMode(2);}}
 r.autoAI=false;r.portrait=false;r.evSoft=0;}
async function saveCurrent(){const r=LIB.find(x=>x.id==curId);if(!r||!loaded)return;const p=params(),ch=JSON.stringify(p)!=JSON.stringify(defParams());r.params=ch?p:null;r.edited=ch;r.versions=VERS;
 try{draw();r.thumb=ch?await makeThumb(cv):r.thumb0;}catch(e){}try{await dbPut(r);}catch(e){}}
async function openItem(id){const r=LIB.find(x=>x.id==id);if(!r)return;if(!$("app").classList.contains("hide"))await saveCurrent();curId=id;VERS=(r.versions||[]).slice();toast("Opening...",0);
 const img=new Image();img.onload=()=>{try{$("lib").classList.add("hide");$("app").classList.remove("hide");$("xp").classList.add("hide");subSel={};
  loadSource(img,img.naturalWidth,img.naturalHeight);afterOpen(r);$("toast").classList.add("hide");URL.revokeObjectURL(img.src);}catch(e){toast("Could not open photo: "+e.message,6000);}};
 img.onerror=()=>toast("This photo can't be opened (format not supported).",6000);img.src=URL.createObjectURL(r.orig);}
async function goBackLib(){await saveCurrent();loaded=false;$("app").classList.add("hide");$("lib").classList.remove("hide");$("xp").classList.add("hide");$("menu").classList.add("hide");scr=null;pmain=null;
 view="lc";folder="all";selMode=false;sel.clear();await refreshLib();toast("Saved to LightCraft",1500);}
$("back").onclick=goBackLib;
let lastBack=0;
window.lcBack=()=>{const m=$("menu");if(!m.classList.contains("hide")){m.classList.add("hide");return true;}
 if(camOpen()){if(!$("cset").classList.contains("hide")){$("cset").classList.add("hide");return true;}closeCam();return true;}
 if(!$("app").classList.contains("hide")){if(!$("xp").classList.contains("hide")){closeExport();return true;}if(scr){scr=null;showPanel();return true;}goBackLib();return true;}
 if(selMode){selMode=false;sel.clear();renderLib();return true;}
 const n=Date.now();if(n-lastBack<2000)return false;lastBack=n;toast("Press back again to exit",1800);return true;};
/* ---- export ---- */
let xf="jpg",xq=92,xs=0;
function exportBlob(){draw();let c=cv;if(xs){const k=Math.min(1,xs/Math.max(cv.width,cv.height));if(k<1){c=document.createElement("canvas");c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);c.getContext("2d").drawImage(cv,0,0,c.width,c.height);}}
 return new Promise(ok=>c.toBlob(ok,xf=="png"?"image/png":"image/jpeg",xq/100));}
const fname=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return"LightCraft_"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+"."+(xf=="png"?"png":"jpg");};
const b64=blob=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.readAsDataURL(blob);});
async function savePhone(blob,name){try{if(window.LCNative&&LCNative.save){return LCNative.save(await b64(blob),name,blob.type||"image/jpeg");}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return"ok";}catch(e){return e.message;}}
function openExport(){if(!loaded)return;$("dock").classList.add("hide");$("panel").classList.add("hide");$("xp").classList.remove("hide");renderExport();}
function closeExport(){$("xp").classList.add("hide");$("dock").classList.remove("hide");renderDock();}
function renderExport(){const on=(c)=>c?' class="on"':"";
 $("xp").innerHTML=`<h3>Export</h3><div class="xr"><span>Format</span><button data-f="jpg"${on(xf=="jpg")}>JPG</button><button data-f="png"${on(xf=="png")}>PNG</button></div>
 <div class="xr${xf=="png"?" hide":""}"><span>Quality</span><input type="range" min="50" max="100" value="${xq}"><b id="xqv">${xq}</b></div>
 <div class="xr"><span>Size</span><button data-s="0"${on(xs==0)}>Original</button><button data-s="2048"${on(xs==2048)}>2048 px</button><button data-s="1080"${on(xs==1080)}>1080 px</button></div>
 <div class="xr"><button class="main" id="xsave" style="flex:1">Save to phone</button><button id="xshare" style="flex:1">Share</button></div><div class="xr"><button id="xclose" style="flex:1">Close</button></div>`;
 $("xp").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{xf=b.dataset.f;renderExport();});
 $("xp").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{xs=+b.dataset.s;renderExport();});
 const qi=$("xp").querySelector("input");if(qi)qi.oninput=()=>{xq=+qi.value;$("xqv").textContent=xq;};
 $("xclose").onclick=closeExport;
 $("xsave").onclick=async()=>{toast("Saving...",0);const blob=await exportBlob();if(!blob){toast("Export failed",4000);return;}const r=await savePhone(blob,fname());toast(r=="ok"?"Saved to Pictures/LightCraft":"Could not save: "+r,5000);saveCurrent();};
 $("xshare").onclick=async()=>{const blob=await exportBlob();if(!blob)return;const f=new File([blob],fname(),{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e.name=="AbortError")return;}toast("Sharing is not available here. Use Save to phone.",4000);};}
buildDock();
dbOpen().then(refreshLib).catch(e=>{toast("Storage unavailable: "+e.message,6000);renderLib();});
</script></body></html>
