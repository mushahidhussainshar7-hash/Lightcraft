<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LightCraft</title>
<style>
:root{--bg:#111;--s:#202020;--s2:#2e2e2e;--panel:#242424;--line:#3a3a3a;--txt:#eee;--dim:#9a9a9a;--ac:#64a9ff;--blue:#2684ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:Roboto,"Segoe UI",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.main{background:var(--blue);color:#fff;font-weight:600;border-radius:10px;padding:11px 14px}
#lib{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0);background:#151515;position:relative}
#ltop{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--s)}#ltop b{font-size:14px;letter-spacing:2px}
#ltop div{display:flex;gap:6px}#ltop button{padding:8px 13px;font-size:13px;color:#ddd;background:var(--s2);border-radius:16px}
#ltitle{display:flex;align-items:center;justify-content:space-between;padding:18px 17px 6px}#lt{font-size:20px;font-weight:600}#lcount{font-size:13px;color:var(--dim)}
#grid{flex:1;overflow-y:auto;padding:0 3px 96px}
.mh{padding:14px 14px 4px;color:#ddd;font-size:15px;font-weight:600}.dh{font-size:12px;color:var(--dim);margin:6px 14px 4px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.cell{position:relative;aspect-ratio:1;background:#303030;overflow:hidden}.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .bd{position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.cell.sel::after{content:"";position:absolute;inset:0;background:#2684ed66;border:3px solid var(--ac)}
.empty{color:#888;text-align:center;padding:70px 30px;line-height:1.7;font-size:14px}
#fab{position:absolute;right:18px;bottom:82px;background:var(--blue);border-radius:40px;display:flex;overflow:hidden;box-shadow:0 4px 14px #0008;z-index:3;color:#fff}
.fb{display:flex;align-items:center;justify-content:center;padding:14px 18px;color:#fff}
#nav{display:flex;height:62px;flex:none;background:var(--s);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#aaa;font-size:11px}#nav button.on{color:var(--ac)}#nav svg{width:22px;height:22px}
#selbar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));background:var(--s)}#selbar button{flex:1;background:var(--s2);border-radius:10px;padding:12px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0);background:#000;position:relative}
#top{height:56px;flex:none;background:#080808;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.tg{display:flex;align-items:center;gap:2px}.tg button{padding:10px;color:#eee}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;padding:4px}
canvas{max-width:100%;max-height:100%;object-fit:contain}
#beforeBadge{position:absolute;top:12px;left:12px;background:#0009;padding:5px 8px;font-size:10px;letter-spacing:1px}
#dock{flex:none;background:var(--s);border-top:1px solid #343434;padding-bottom:env(safe-area-inset-bottom,0)}
#ptools{height:78px;display:flex;justify-content:space-around;padding:5px 2px 2px}
.tool{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#bdbdbd;font-size:11px;white-space:nowrap;border-radius:8px}.tool.sel{background:#353535;color:#fff}
#stools{height:72px;display:flex;overflow-x:auto;border-top:1px solid #383838;scrollbar-width:none}#stools::-webkit-scrollbar{display:none}#stools .tool{flex:0 0 74px;gap:5px}
#panel{flex:none;background:var(--panel);border-top:1px solid #444;display:flex;flex-direction:column;max-height:46vh;min-height:210px;padding-bottom:env(safe-area-inset-bottom,0)}
#ph{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid #444;font-size:12px;font-weight:600;letter-spacing:.5px}
#ph button{color:#bbb;font-size:12px;padding:8px 9px;letter-spacing:.5px}#pdone{color:#fff!important}
#ptabs{height:42px;flex:none;display:flex;overflow-x:auto;border-bottom:1px solid #444;scrollbar-width:none}
#ptabs button{flex:none;padding:0 17px;color:#aaa;font-size:12px;position:relative;letter-spacing:.4px}#ptabs button.on{color:#fff}#ptabs button.on:after{content:"";height:2px;background:#eee;position:absolute;bottom:0;left:12px;right:12px}
#prows{flex:1;min-height:0;overflow-y:auto;padding:2px 18px 12px}
.row{border-bottom:1px solid #393939;padding:9px 0 3px}.rowhead{display:flex;justify-content:space-between;align-items:center;font-size:13px}.rowhead output{color:#ccc;font-size:12px;min-width:48px;text-align:right;padding:3px 0;cursor:pointer}
.trk{position:relative;height:30px;touch-action:pan-y}.rail{position:absolute;left:0;right:0;top:13px;height:3px;border-radius:2px;background:#555}.fill{position:absolute;top:0;height:100%;background:#ddd;border-radius:2px}
.th{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #000a}
.bgrid{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 8px}.b{background:#333;border-radius:6px;padding:9px 13px;font-size:12px;color:#ddd}.b.on{background:#fff;color:#111}
.note{color:#aaa;font-size:13px;line-height:1.6;padding:16px 0}
.selrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #393939;font-size:13px}.selrow select{background:#333;color:#eee;border:0;padding:8px 10px;border-radius:4px;font-size:13px}
.mixdots{display:flex;justify-content:space-between;gap:7px;padding:14px 2px 8px}.dot{width:29px;height:29px;border-radius:50%;border:3px solid var(--sw);display:grid;place-items:center;flex:none;padding:0}.dot.on:after{content:"";width:11px;height:11px;border-radius:50%;background:#fff}
.wheelwrap{height:190px;display:flex;align-items:center;justify-content:center}
.wheel{width:176px;height:176px;border-radius:50%;position:relative;touch-action:none;background:conic-gradient(#ff263b,#ffdf00,#20df4a,#00dce8,#245bff,#bd20ff,#ff267b,#ff263b);box-shadow:inset 0 0 0 1px #ffffff20}
.wheel:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#777 0%,#fff0 72%)}
.pin{position:absolute;width:22px;height:22px;border:3px solid #ddd;background:#242424;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #222}
#xp{background:var(--panel);border-top:1px solid #444;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0))}
#xp h3,#cset h3{margin:0 0 8px;font-size:17px}.xr{display:flex;gap:8px;margin:10px 0;align-items:center}.xr span{font-size:13px;color:var(--dim);width:60px}
.xr button{padding:8px 14px;font-size:13px;color:#ccc;background:#333;border-radius:6px}.xr button.on{background:#fff;color:#111}.xr button.main{background:var(--blue);color:#fff}.xr input{flex:1;accent-color:#ddd}
#menu{position:fixed;z-index:25;background:#2a2a2a;border-radius:10px;box-shadow:0 6px 24px #000c;min-width:200px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;color:#ddd}#menu button.on{color:var(--ac)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:14px;font-size:13px;z-index:30;max-width:90%;text-align:center}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#camtop{display:flex;justify-content:space-between;padding:10px 12px;gap:6px}#camtop button{background:#26262a;padding:8px 12px;font-size:13px;border-radius:18px}
#vw{position:relative;flex:1;min-height:0;overflow:hidden}#vid{width:100%;height:100%;object-fit:contain}
#camctl{max-height:32%;overflow-y:auto;padding:6px 16px;background:var(--s)}
.crow{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.crow input{width:100%;accent-color:#ddd}
.camrow{display:flex;justify-content:space-around;align-items:center;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0))}
#shot{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #777;padding:0}
#zrow{display:flex;justify-content:center;align-items:center;gap:8px;padding:6px;font-size:13px}#zrow button{padding:6px 10px;font-size:12px;background:#26262a;border-radius:14px}
#modes{display:flex;justify-content:center;gap:6px;padding:4px 0}#modes button{padding:6px 14px;font-size:13px;color:#999}#modes button.on{color:#ffd24a}
#grid3{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,#fff5 33.2%,#fff5 33.5%,transparent 33.5%,transparent 66.4%,#fff5 66.4%,#fff5 66.7%,transparent 66.7%),linear-gradient(0deg,transparent 33.2%,#fff5 33.2%,#fff5 33.5%,transparent 33.5%,transparent 66.4%,#fff5 66.4%,#fff5 66.7%,transparent 66.7%)}
#pbl{position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#subj{position:absolute;border:2px solid #ffd24a;border-radius:10px;pointer-events:none}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#lastshot{width:56px;height:56px;border-radius:12px;padding:0;background:#26262a center/cover no-repeat;border:2px solid #555}#cf{width:56px;padding:8px 0;font-size:12px;background:#26262a;border-radius:14px}#pro{display:none}
#cset{position:absolute;left:0;right:0;bottom:0;max-height:75%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0));z-index:8}
.srow{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;gap:10px}.srow select{background:#333;color:var(--txt);border:0;border-radius:8px;padding:8px;font-size:14px;max-width:52%}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}.hd2{margin:14px 0 2px;color:var(--ac);font-size:12px;font-weight:700}
</style></head><body>
<div id="lib">
 <div id="ltop"><b>LIGHTCRAFT</b><div><button id="selbtn">Select</button><button id="gear">AI setup</button></div></div>

 <div id="grid"></div>

 <div id="selbar" class="hide"></div><nav id="nav"></nav>
</div>
<div id="app" class="hide">
 <header id="top">
  <div class="tg"><button id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="info" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.01"/></svg></button></div>
  <div class="tg"><button id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button id="save" aria-label="Export"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></button><button id="share" aria-label="Share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button><button id="more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button></div>
 </header>
 <main id="stage"><canvas id="cv" hidden></canvas><div id="beforeBadge" class="hide">BEFORE</div></main>
 <section id="dock" class="hide"><div id="ptools"></div><div id="stools"></div></section>
 <section id="panel" class="hide"><div id="ph"><span id="pn">LIGHT</span><div><button id="prst">RESET</button><button id="pdone">DONE</button></div></div><div id="ptabs"></div><div id="prows"></div></section>
 <div id="xp" class="hide"></div>
</div>
<div id="cam" class="hide">
 <div id="camtop"><button id="cx">Close</button><button id="fl">Flash off</button><button id="tm">Timer off</button><button id="cs">Settings</button></div>
 <div id="vw"><video id="vid" playsinline autoplay muted></video><div id="grid3" class="hide"></div><div id="pbl" class="hide"></div><div id="subj" class="hide"></div><div id="cd" class="hide"></div></div>
 <div id="zrow"><button id="evm">EV -</button><span id="evl">EV 0.0</span><button id="evp">EV +</button><button id="zm">Zoom -</button><span id="zl">1.0x</span><button id="zp">Zoom +</button></div>
 <div id="camctl" class="hide"></div>
 <div id="modes"><button data-m="photo" class="on">Photo</button><button data-m="portrait">Portrait</button><button data-m="pro">Pro</button></div>
 <div class="camrow"><button id="lastshot"></button><button id="shot"></button><button id="cf">Flip</button></div>
 <div id="cset" class="hide"></div>
</div>
<input type="file" id="file" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<div id="menu" class="hide"></div><div id="toast" class="hide"></div>
<script>

["temp","Temperature",-1,1,0,"color"],["tint","Tint",-1,1,0,"color"],["vibrance","Vibrance",-1,1,0,"color"],["saturation","Saturation",-1,1,0,"color"],
["gsH","H",0,1,0,"c"],["gsS","S",0,1,0,"c"],["gsL","L",-1,1,0,"c"],["gsB","B",-1,1,0,"c"],["gsK","K",0,1,.5,"c"],["gmH","H",0,1,0,"c"],["gmS","S",0,1,0,"c"],["gmL","L",-1,1,0,"c"],["gmB","B",-1,1,0,"c"],["gmK","K",0,1,.5,"c"],["ghH","H",0,1,0,"c"],["ghS","S",0,1,0,"c"],["ghL","L",-1,1,0,"c"],["ghB","B",-1,1,0,"c"],["ghK","K",0,1,.5,"c"],["ggH","H",0,1,0,"c"],["ggS","S",0,1,0,"c"],["ggL","L",-1,1,0,"c"],
["texAmt","Texture",-1,1,0,"detail"],["clarity","Clarity",-1,1,0,"detail"],["dehaze","Dehaze",-1,1,0,"detail"],
["sharpen","Amount",0,1,0,"sharpen"],["sradius","Radius",.5,3,1,"sharpen"],["smask","Masking",0,1,0,"sharpen"],["nrl","Luminance",0,1,0,"sharpen"],["nrc","Color",0,1,0,"sharpen"],
["bamt","Strength",0,1,.5,"blur"],["bfocus","Focus size",.1,1,.35,"blur"],["bfeather","Feather",0,1,.3,"blur"],["dist","Distortion",-1,1,0,"o"],["lvig","Vignetting",-1,1,0,"o"],["ca","Chromatic aberration",0,1,0,"o"]];

vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1e-10;return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}

 $("pbl").classList.toggle("hide",m!="portrait");if(m!="portrait")$("subj").classList.add("hide");$("camctl").classList.toggle("hide",m!="pro");
 if(m=="portrait"){setPortrait(pcen[0],pcen[1],32,40);toast("Portrait: tap the subject, or let auto-detect find the face");}}
[...$("modes").children].forEach(b=>b.onclick=()=>setCamMode(b.dataset.m));
$("vw").addEventListener("click",e=>{if(camMode!="portrait")return;const r=$("vw").getBoundingClientRect();pcSet=true;$("subj").classList.add("hide");setPortrait((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,32,40);});
setInterval(async()=>{if(camMode!="portrait"||!stream)return;if(fdet===null)fdet="FaceDetector" in window?new FaceDetector({fastMode:true,maxDetectedFaces:4}):false;if(!fdet)return;
 try{const f=await fdet.detect($("vid"));if(!f.length)return;const b=f.sort((a,c)=>c.boundingBox.width-a.boundingBox.width)[0].boundingBox,v=$("vid");
  const cx=(b.x+b.width/2)/v.videoWidth,cy=(b.y+b.height/2)/v.videoHeight,w=b.width/v.videoWidth,h=b.height/v.videoHeight;
  pcSet=true;setPortrait(cx,cy,Math.max(18,w*160),Math.max(24,h*220));
  const s=$("subj");s.classList.remove("hide");s.style.left=(cx-w/2)*100+"%";s.style.top=(cy-h/2)*100+"%";s.style.width=w*100+"%";s.style.height=h*100+"%";}catch(e){}},700);
const VOPT=[["capture","Take photo"],["zoomin","Zoom in"],["zoomout","Zoom out"],["evup","Exposure +"],["evdown","Exposure -"],["flash","Change flash mode"],["timer","Change timer"],["none","Do nothing"]];
function renderCS(){const sl=(k,o)=>`<select data-k="${k}">${o.map(([v,l])=>`<option value="${v}"${String(CS[k])==String(v)?" selected":""}>${l}</option>`).join("")}</select>`,ck=k=>`<input type="checkbox" data-k="${k}"${CS[k]?" checked":""}>`;
 $("cset").innerHTML=`<h3>Camera settings</h3><div class="hd2">VOLUME KEYS</div>
 <div class="srow"><span>Volume up</span>${sl("vu",VOPT)}</div><div class="srow"><span>Volume down</span>${sl("vd",VOPT)}</div>
 <div class="hd2">CAPTURE</div>
 <div class="srow"><span>Timer</span>${sl("timer",[[0,"Off"],[3,"3 seconds"],[5,"5 seconds"],[10,"10 seconds"]])}</div>
 <div class="srow"><span>Aspect ratio</span>${sl("asp",[["full","Full frame"],["4:3","4:3"],["16:9","16:9"],["1:1","1:1"]])}</div>
 <div class="srow"><span>Photo quality</span>${sl("q",[[95,"High"],[85,"Medium"],[70,"Low"]])}</div>
 <div class="srow"><span>Grid lines</span>${ck("grid")}</div><div class="srow"><span>Mirror front camera</span>${ck("mirror")}</div>
 <div class="srow"><span>Shutter sound</span>${ck("sound")}</div><div class="srow"><span>Save copy to phone gallery</span>${ck("phone")}</div>
 <div class="srow"><span>Auto enhance after capture</span>${ck("ai")}</div><button class="main" id="csdone" style="width:100%;margin-top:8px">Done</button>`;
 $("cset").querySelectorAll("[data-k]").forEach(e=>e.onchange=()=>{const k=e.dataset.k;CS[k]=e.type=="checkbox"?e.checked:(e.value!==""&&!isNaN(+e.value)?+e.value:e.value);saveCS();applyCS();});
 $("csdone").onclick=()=>$("cset").classList.add("hide");}
$("cs").onclick=()=>{renderCS();$("cset").classList.remove("hide");};
$("fl").onclick=()=>{if(!caps.torch){alert("Flash is not available on this camera (front camera or unsupported phone).");return;}
 flash=(flash+1)%3;$("fl").textContent=["Flash off","Flash on","Flash auto"][flash];torch(flash==1);};
$("tm").onclick=()=>{const o=[0,3,5,10];CS.timer=o[(o.indexOf(CS.timer)+1)%4];saveCS();applyCS();};
$("cf").onclick=()=>{face=face=="environment"?"user":"environment";startCam();};
$("cx").onclick=()=>{stopCam();$("cam").classList.add("hide");refreshLib();};
$("zp").onclick=()=>applyZoom(zoom*1.15);$("zm").onclick=()=>applyZoom(zoom/1.15);
$("evp").onclick=()=>applyEv(ev+.3);$("evm").onclick=()=>applyEv(ev-.3);
function volAct(a,rc){if(a=="capture"){if(!rc)shotClick();}else if(a=="zoomin")applyZoom(zoom*1.1);else if(a=="zoomout")applyZoom(zoom/1.1);else if(a=="evup")applyEv(ev+.3);else if(a=="evdown")applyEv(ev-.3);else if(a=="flash")$("fl").click();else if(a=="timer"&&!rc)$("tm").click();}
window.lcVol=(d,rc)=>{if(!stream)return;volAct(d=="up"?CS.vu:CS.vd,rc);};
document.addEventListener("keydown",e=>{if(e.key=="AudioVolumeUp")lcVol("up",0);if(e.key=="AudioVolumeDown")lcVol("down",0);});
let pd=0,pz=1;const vwEl=$("vw"),dist2=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
vwEl.addEventListener("touchstart",e=>{if(e.touches.length==2){pd=dist2(e);pz=zoom;}},{passive:true});
vwEl.addEventListener("touchmove",e=>{if(e.touches.length==2&&pd)applyZoom(pz*dist2(e)/pd);},{passive:true});
vwEl.addEventListener("touchend",()=>pd=0);
function beep(){if(!CS.sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1200;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.06);}catch(e){}}
function shotClick(){if(cdT){clearInterval(cdT);cdT=null;$("cd").classList.add("hide");return;}
 if(CS.timer>0){let n=CS.timer;$("cd").textContent=n;$("cd").classList.remove("hide");cdT=setInterval(()=>{n--;if(n<=0){clearInterval(cdT);cdT=null;$("cd").classList.add("hide");doShot();}else $("cd").textContent=n;},1000);}else doShot();}
$("shot").onclick=shotClick;
async function doShot(){const v=$("vid");if(!v.videoWidth||!stream)return;let lit=false;
 if(flash==2){const t=document.createElement("canvas");t.width=t.height=16;const x=t.getContext("2d");x.drawImage(v,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  if(s/256<70){lit=true;torch(true);await new Promise(r=>setTimeout(r,450));}}
 const dz=hwZoom?1:zoom;let sw=v.videoWidth/dz,sh=v.videoHeight/dz,sx=(v.videoWidth-sw)/2,sy=(v.videoHeight-sh)/2;
 if(CS.asp!="full"){const[a,b]=CS.asp.split(":").map(Number);let r=a/b;if(sw<sh)r=1/r;if(sw/sh>r){const nw=sh*r;sx+=(sw-nw)/2;sw=nw;}else{const nh=sw/r;sy+=(sh-nh)/2;sh=nh;}}
 const c=document.createElement("canvas");c.width=Math.round(sw);c.height=Math.round(sh);const x=c.getContext("2d");
 if(face=="user"&&CS.mirror){x.translate(c.width,0);x.scale(-1,1);}
 x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);if(lit)torch(false);beep();
 const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",CS.q/100));
 try{const rec=await addPhoto(blob,{source:"camera",date:Date.now(),autoAI:CS.ai&&camMode!="pro",portrait:camMode=="portrait",pc:camMode=="portrait"&&pcSet?[...pcen]:null,evSoft:!hwEv?ev:0},c);
  lastRec=rec;$("lastshot").style.backgroundImage="url("+rec.thumb+")";toast("Saved to LightCraft",1200);
  if(CS.phone)savePhone(blob,"LightCraft_"+rec.date+".jpg").then(r=>{if(r!="ok")toast("Could not save to phone: "+r,4000);});}
 catch(e){toast("Could not save photo: "+e.message,5000);}}
$("lastshot").onclick=async()=>{if(!lastRec)return;const id=lastRec.id;stopCam();$("cam").classList.add("hide");await refreshLib();openItem(id);};
/* ---- load / mask / export ---- */
function autoMask(){const n=96,c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");x.drawImage(srcCv,0,0,n,n);const d=x.getImageData(0,0,n,n).data;
 let r=0,g=0,b=0,k=0;for(let i=0;i<n;i++)for(const j of[0,1,n-2,n-1])for(const[a,e]of[[i,j],[j,i]]){const p=(e*n+a)*4;r+=d[p];g+=d[p+1];b+=d[p+2];k++;}
 r/=k;g/=k;b/=k;let m=new Float32Array(n*n),mx=1e-6;
 for(let y=0;y<n;y++)for(let i=0;i<n;i++){const p=(y*n+i)*4,cx=i/n-.5,cy=y/n-.5,v=Math.hypot(d[p]-r,d[p+1]-g,d[p+2]-b)*Math.exp(-(cx*cx+cy*cy)/.18);m[y*n+i]=v;mx=Math.max(mx,v);}
 for(let pass=0;pass<4;pass++){const o=new Float32Array(n*n);for(let y=0;y<n;y++)for(let i=0;i<n;i++){let s=0,q=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=i+dx;if(yy<0||xx<0||yy>=n||xx>=n)continue;s+=m[yy*n+xx];q++;}o[y*n+i]=s/q;}m=o;}
 const out=new Uint8Array(n*n);for(let i=0;i<n*n;i++){const t=Math.max(0,Math.min(1,(m[i]/mx-.2)/.35));out[i]=Math.round(t*t*(3-2*t)*255);}
 uploadMask(out,n);}
function loadSource(src,w0,h0){const k=Math.min(1,3000/Math.max(w0,h0));W=Math.round(w0*k);H=Math.round(h0*k);
 srcCv=document.createElement("canvas");srcCv.width=W;srcCv.height=H;srcCv.getContext("2d").drawImage(src,0,0,W,H);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCv);
 autoMask();loaded=true;cv.hidden=false;$("dock").classList.remove("hide");
 resetCrop();bmode=0;apply();closePanel();histReset();}
window.onerror=(m,s,l)=>toast("Error: "+m+" (line "+l+")",6000);
/* ---- storage ---- */
let DB,LIB=[],view="gallery",folder="all",sel=new Set(),selMode=false,curId=null;
function dbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open("lightcraft",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>{DB=r.result;ok();};r.onerror=()=>no(r.error);});}
const store=m=>DB.transaction("photos",m).objectStore("photos");
const dbAll=()=>new Promise((ok,no)=>{const q=store("readonly").getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);});
const dbPut=rec=>new Promise((ok,no)=>{const q=store("readwrite").put(rec);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);});
const dbDel=id=>new Promise((ok,no)=>{const q=store("readwrite").delete(id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error);});
function makeThumb(src){return new Promise((ok,no)=>{const dr=im=>{const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,k=Math.min(1,360/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.75));};
 if(src instanceof Blob){const im=new Image();im.onload=()=>{dr(im);URL.revokeObjectURL(im.src);};im.onerror=()=>no(new Error("decode"));im.src=URL.createObjectURL(src);}else dr(src);});}
async function addPhoto(blob,meta,src){let th="";try{th=await makeThumb(src||blob);}catch(e){}
 const rec=Object.assign({orig:blob,thumb:th,thumb0:th,date:Date.now(),source:"import",edited:false,deleted:false,params:null},meta);rec.id=await dbPut(rec);LIB.unshift(rec);return rec;}
async function importFiles(files){if(!files.length)return;let n=0;toast("Importing "+files.length+" photo(s)...",0);
 for(const f of files){try{await addPhoto(f,{source:"import",date:f.lastModified||Date.now(),name:f.name});n++;}catch(e){toast("Import error: "+e.message,5000);}}
 toast(n+" photo(s) imported");await refreshLib();}
$("file").addEventListener("click",e=>{e.target.value="";});$("file").addEventListener("change",()=>importFiles([...$("file").files]));
/* ---- library ---- */
const FOLD=[["all","All Photos"],["edited","Edited"],["unedited","Unedited"],["imported","Imported"],["deleted","Deleted"]];
const inFolder=(r,f)=>f=="deleted"?!!r.deleted:!r.deleted&&(f=="all"||(f=="edited"&&r.edited)||(f=="unedited"&&!r.edited)||(f=="imported"&&r.source=="import"));
async function refreshLib(){try{LIB=(await dbAll()).sort((a,b)=>b.date-a.date);}catch(e){LIB=[];}renderLib();}
function toggleSel(id,el){if(sel.has(id))sel.delete(id);else sel.add(id);el.classList.toggle("sel",sel.has(id));updSel();}
function updSel(){const bar=$("selbar");bar.classList.toggle("hide",!selMode);$("nav").classList.toggle("hide",selMode);$("selbtn").textContent=selMode?"Done":"Select";bar.innerHTML="";
 const add=(t,fn)=>{const b=document.createElement("button");b.textContent=t;b.onclick=fn;bar.appendChild(b);};
 if(view=="lc"&&folder=="deleted"){add("Restore",()=>selAct("restore"));add("Delete forever",()=>selAct("forever"));}else add("Delete ("+sel.size+")",()=>selAct("delete"));
 add("Cancel",()=>{selMode=false;sel.clear();renderLib();});}
async function selAct(a){if(!sel.size)return;const n=sel.size;for(const id of sel){const r=LIB.find(x=>x.id==id);if(!r)continue;if(a=="forever")await dbDel(id);else{r.deleted=a=="delete";await dbPut(r);}}
 selMode=false;sel.clear();toast(n+" photo(s) "+(a=="delete"?"moved to Deleted":a=="restore"?"restored":"deleted forever"));await refreshLib();}
$("selbtn").onclick=()=>{selMode=!selMode;sel.clear();renderLib();};
function setView(v){view=v;selMode=false;sel.clear();renderLib();}
function renderLib(){const g=$("grid");g.innerHTML="";const gal=view=="gallery";
 $("lt").innerHTML=gal?"Gallery":FOLD.find(f=>f[0]==folder)[1]+" &#9662;";
 [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.s==view));
 const list=gal?LIB.filter(r=>!r.deleted&&r.source=="import"):LIB.filter(r=>inFolder(r,folder));
 $("lcount").textContent=list.length+(list.length==1?" photo":" photos");updSel();$("fab").classList.toggle("hide",selMode);
 if(!list.length){g.innerHTML='<div class="empty">'+(gal?"No imported photos yet.<br>Tap + to import photos from your phone.":"No photos here yet.<br>Import photos or take some with the Camera.")+'</div>';return;}
 let lm="",ld="",cells=null;
 list.forEach(r=>{const d=new Date(r.date),m=d.toLocaleDateString(undefined,{month:"long",year:"numeric"}),dd=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  if(m!=lm){const h=document.createElement("div");h.className="mh";h.textContent=m;g.appendChild(h);lm=m;ld="";}
  if(dd!=ld){const h=document.createElement("div");h.className="dh";h.textContent=dd;g.appendChild(h);cells=document.createElement("div");cells.className="cells";g.appendChild(cells);ld=dd;}
  const c=document.createElement("div");c.className="cell"+(sel.has(r.id)?" sel":"");
  c.innerHTML=(r.thumb?'<img decoding="async" src="'+r.thumb+'">':'<div class="empty" style="padding:30px 0">?</div>')+(r.edited?'<i class="bd"></i>':"");
  let lp=null,fired=false;
  c.onpointerdown=()=>{fired=false;lp=setTimeout(()=>{fired=true;selMode=true;toggleSel(r.id,c);},450);};
  c.onpointerup=c.onpointerleave=c.onpointercancel=()=>clearTimeout(lp);
  c.onclick=()=>{if(fired)return;if(selMode)toggleSel(r.id,c);else openItem(r.id);};
  cells.appendChild(c);});}
$("lt").onclick=()=>{if(view=="lc")showMenu(FOLD.map(([k,l])=>[l+"  ("+LIB.filter(r=>inFolder(r,k)).length+")",()=>{folder=k;sel.clear();renderLib();},k==folder]),{top:110,left:14});};
$("fabcam").onclick=startCam;
IC.gallery='<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-8 8"/>';IC.lc='<path d="M3 4h7v7H3zM14 4h7v7h-7zM3 15h7v5H3zM14 15h7v5h-7z"/>';
[["gallery","Gallery",IC.gallery],["lc","LightCraft",IC.lc],["cam","Camera",IC.camera]].forEach(([s,l,ic])=>{const b=document.createElement("button");b.dataset.s=s;b.innerHTML=svg(ic)+l;b.onclick=()=>s=="cam"?startCam():setView(s);$("nav").appendChild(b);});
/* ---- editor open / save ---- */
const defV=()=>{const o={};S.forEach(s=>o[s[0]]=s[4]);return o;};
const params=()=>({V:{...V},HS:HS.map(a=>[...a]),crop:{...crop},bmode,bc:[...bc]});
const defParams=()=>({V:defV(),HS:Array.from({length:8},()=>[0,0,0]),crop:NEWCROP(),bmode:0,bc:[.5,.5]});
function afterOpen(r){if(r.params){const p=r.params;Object.assign(V,p.V);p.HS.forEach((a,i)=>HS[i]=a);crop=Object.assign(NEWCROP(),p.crop);bmode=p.bmode||0;bc=p.bc||[.5,.5];layout();renderChips();refresh();queue();return;}
 if(r.autoAI)aiRun();else if(r.evSoft){V.exposure=r.evSoft;queue();refresh();}
 if(r.portrait){V.bamt=.7;if(r.pc){bc=[...r.pc];V.bfocus=.3;setMode(1);}else if(KEY())aiSubject();else{autoMask();setMode(2);}}
 r.autoAI=false;r.portrait=false;r.evSoft=0;}
async function saveCurrent(){const r=LIB.find(x=>x.id==curId);if(!r||!loaded)return;const p=params(),ch=JSON.stringify(p)!=JSON.stringify(defParams());r.params=ch?p:null;r.edited=ch;
 try{draw();r.thumb=ch?await makeThumb(cv):r.thumb0;}catch(e){}try{await dbPut(r);}catch(e){}}
async function openItem(id){const r=LIB.find(x=>x.id==id);if(!r)return;if(!$("app").classList.contains("hide"))await saveCurrent();curId=id;toast("Opening...",0);
 const img=new Image();img.onload=()=>{try{$("lib").classList.add("hide");$("app").classList.remove("hide");$("xp").classList.add("hide");subSel={};
  loadSource(img,img.naturalWidth,img.naturalHeight);afterOpen(r);$("toast").classList.add("hide");URL.revokeObjectURL(img.src);}catch(e){toast("Could not open photo: "+e.message,6000);}};
 img.onerror=()=>toast("This photo can't be opened (format not supported).",6000);img.src=URL.createObjectURL(r.orig);}
$("back").onclick=async()=>{await saveCurrent();loaded=false;$("app").classList.add("hide");$("lib").classList.remove("hide");$("xp").classList.add("hide");await refreshLib();};
/* ---- export ---- */
let xf="jpg",xq=92,xs=0;
function exportBlob(){draw();let c=cv;if(xs){const k=Math.min(1,xs/Math.max(cv.width,cv.height));if(k<1){c=document.createElement("canvas");c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);c.getContext("2d").drawImage(cv,0,0,c.width,c.height);}}
 return new Promise(ok=>c.toBlob(ok,xf=="png"?"image/png":"image/jpeg",xq/100));}
const fname=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return"LightCraft_"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+"."+(xf=="png"?"png":"jpg");};
const b64=blob=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.readAsDataURL(blob);});
async function savePhone(blob,name){try{if(window.LCNative&&LCNative.save){return LCNative.save(await b64(blob),name,blob.type||"image/jpeg");}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return"ok";}catch(e){return e.message;}}
function openExport(){if(!loaded)return;$("dock").classList.add("hide");$("panel").classList.add("hide");$("xp").classList.remove("hide");renderExport();}
function closeExport(){$("xp").classList.add("hide");$("dock").classList.remove("hide");renderDock();}
function renderExport(){const on=(c)=>c?' class="on"':"";
 $("xp").innerHTML=`<h3>Export</h3><div class="xr"><span>Format</span><button data-f="jpg"${on(xf=="jpg")}>JPG</button><button data-f="png"${on(xf=="png")}>PNG</button></div>
 <div class="xr${xf=="png"?" hide":""}"><span>Quality</span><input type="range" min="50" max="100" value="${xq}"><b id="xqv">${xq}</b></div>
 <div class="xr"><span>Size</span><button data-s="0"${on(xs==0)}>Original</button><button data-s="2048"${on(xs==2048)}>2048 px</button><button data-s="1080"${on(xs==1080)}>1080 px</button></div>
 <div class="xr"><button class="main" id="xsave" style="flex:1">Save to phone</button><button id="xshare" style="flex:1">Share</button></div><div class="xr"><button id="xclose" style="flex:1">Close</button></div>`;
 $("xp").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{xf=b.dataset.f;renderExport();});
 $("xp").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{xs=+b.dataset.s;renderExport();});
 const qi=$("xp").querySelector("input");if(qi)qi.oninput=()=>{xq=+qi.value;$("xqv").textContent=xq;};
 $("xclose").onclick=closeExport;
 $("xsave").onclick=async()=>{toast("Saving...",0);const blob=await exportBlob();if(!blob){toast("Export failed",4000);return;}const r=await savePhone(blob,fname());toast(r=="ok"?"Saved to Pictures/LightCraft":"Could not save: "+r,5000);saveCurrent();};
 $("xshare").onclick=async()=>{const blob=await exportBlob();if(!blob)return;const f=new File([blob],fname(),{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e.name=="AbortError")return;}toast("Sharing is not available here. Use Save to phone.",4000);};}
$("save").onclick=openExport;
buildDock();
dbOpen().then(refreshLib).catch(e=>{toast("Storage unavailable: "+e.message,6000);renderLib();});
</script></body></html>
